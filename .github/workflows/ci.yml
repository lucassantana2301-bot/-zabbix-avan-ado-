name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: zbxctl e loja demo (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            zbxctl/pyproject.toml
            demo-app/requirements.txt
      - run: pip install -e "./zbxctl[dev]" -r demo-app/requirements.txt httpx
      - name: Lint e tipos
        working-directory: zbxctl
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Testes do zbxctl
        working-directory: zbxctl
        run: pytest -q
      - name: Testes da loja demo
        working-directory: demo-app
        run: pytest -q
      - name: Valida o YAML de monitoramento
        run: zbxctl validate -f monitoring/zabbix.yaml
      - name: Valida o compose e o dashboard
        run: |
          docker compose config -q
          python -m json.tool grafana/dashboards/observabilidade.json > /dev/null

  e2e:
    name: E2E (Zabbix real, queda e recuperação)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 25
    env:
      ZABBIX_URL: http://localhost:8080
      ZABBIX_PASSWORD: zabbix
      # Credenciais fictícias: valida a criação do media type e da ação sem enviar nada.
      TELEGRAM_BOT_TOKEN: '000000:ci-dummy'
      TELEGRAM_CHAT_ID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ./zbxctl
      - name: Sobe a stack
        run: docker compose up -d --build
      - name: Espera a API do Zabbix
        run: zbxctl wait --timeout 400
      - name: Diagnóstico do banco durante o apply (em segundo plano)
        run: |
          cat > activity.sql <<'SQL'
          SELECT pid, state, wait_event_type, wait_event, now() - query_start AS running,
                 left(translate(query, chr(10), ' '), 160) AS query
            FROM pg_stat_activity
           WHERE datname = 'zabbix' AND state <> 'idle' AND pid <> pg_backend_pid();
          SQL
          cat > monitor.sh <<'SH'
          for i in $(seq 1 60); do
            echo "=== $(date +%T)"
            docker compose exec -T postgres psql -U zabbix -d zabbix -At < activity.sql
            sleep 10
          done
          SH
          nohup bash monitor.sh > pg-activity.log 2>&1 &
      - name: Aplica o monitoramento como código
        env:
          ZABBIX_TIMEOUT: '600'
        run: zbxctl apply -f monitoring/zabbix.yaml
      - name: Idempotência (o segundo plan não pode ter mudanças)
        run: zbxctl plan -f monitoring/zabbix.yaml --detailed-exitcode
      - name: Derruba a loja, espera o alerta e a recuperação
        run: python scripts/e2e.py
      - name: Logs em caso de falha
        if: failure()
        run: |
          echo "----- pg_stat_activity -----"; cat pg-activity.log || true
          docker compose logs --tail=200
