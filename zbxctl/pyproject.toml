[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zbxctl"
dynamic = ["version"]
description = "Monitoramento como código para Zabbix 7: YAML declarativo com plan/apply idempotente"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1.0", "pydantic>=2.9,<3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
zbxctl = "zbxctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zbxctl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "S"]
ignore = ["S101"] # assert é usado nos testes

[tool.ruff.lint.per-file-ignores]
# Credenciais fictícias do Zabbix falso; linhas de YAML inline nos casos de teste.
"tests/**" = ["S105", "S106", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.hatch.version]
path = "src/zbxctl/__init__.py"
