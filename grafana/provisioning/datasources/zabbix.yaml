apiVersion: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    editable: false
    jsonData:
      username: ${ZABBIX_USER}
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
    secureJsonData:
      password: ${ZABBIX_PASSWORD}
